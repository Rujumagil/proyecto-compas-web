name: Publish Static Root

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - ".github/workflows/publish-static-root.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy exported site to Pages root
        shell: bash
        run: |
          rsync -a --exclude='server/' --exclude='.openai/' dist/ ./
          touch .nojekyll

          for route in \
            compas-one \
            compas-academy \
            compas-creators \
            compas-ia \
            soluciones \
            casos-de-exito \
            nosotros \
            informacion-legal \
            privacidad \
            terminos \
            cookies \
            ia-y-datos \
            derechos-de-autor; do
            if [ -f "$route.html" ]; then
              mkdir -p "$route"
              cp "$route.html" "$route/index.html"
              cat > "$route.html" <<EOF
          <!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=/$route"><link rel="canonical" href="https://www.proyectocompas.com/$route"><title>Compás Evolution</title></head><body><p>Esta página se encuentra en <a href="/$route">/$route</a>.</p></body></html>
          EOF
            fi
          done

          cat > academia.html <<'EOF'
          <!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=/compas-academy"><link rel="canonical" href="https://www.proyectocompas.com/compas-academy"><title>Compás Academy</title></head><body><p>La Academia Compás ahora se encuentra en <a href="/compas-academy">Compás Academy</a>.</p></body></html>
          EOF

          cat > creators.html <<'EOF'
          <!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=/compas-creators"><link rel="canonical" href="https://www.proyectocompas.com/compas-creators"><title>Compás Creators</title></head><body><p>Compás Creators ahora se encuentra en <a href="/compas-creators">/compas-creators</a>.</p></body></html>
          EOF

          mkdir -p podcast
          cat > podcast/index.html <<'EOF'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=/"><link rel="canonical" href="https://www.proyectocompas.com/"><title>Proyecto Compás</title></head><body><p>Esta sección se integró al nuevo ecosistema Compás Evolution. <a href="/">Ir al inicio</a>.</p></body></html>
          EOF

          mkdir -p linea4lifeformulaexclusiva/4life-plus
          cat > linea4lifeformulaexclusiva/4life-plus/index.html <<'EOF'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=/"><link rel="canonical" href="https://www.proyectocompas.com/"><title>Proyecto Compás</title></head><body><p>Esta dirección pertenece a una versión anterior del sitio. <a href="/">Ir al inicio actual</a>.</p></body></html>
          EOF

      - name: Commit generated site
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/publish-static-root.yml || true
          git commit -m "build: publicar sitio estatico actualizado"
          git push
